name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Check front matter
        run: python build.py --check
      - name: Build site
        run: python build.py
      - name: Install test dependencies
        run: |
          pip install -e '.[test]'
          playwright install --with-deps chromium
      - name: Run tests
        run: pytest
